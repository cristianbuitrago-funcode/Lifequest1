<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>LifeQuest</title>
  <link rel="icon" type="image/png" href="img/logo-192.png">
  <link rel="apple-touch-icon" href="img/logo-512.png">
  <meta name="theme-color" content="#030915">
  <script>
    // Aplica el tema guardado antes de pintar para evitar parpadeos.
    try{
      var t = localStorage.getItem('lifequest:theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  </script>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <img class="brand-logo" src="img/logo-192.png" alt="" width="40" height="40">
      <h1>LifeQuest</h1>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Cambiar tema">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </div>

  <div class="char-card" id="charCard">
    <span class="char-pet" id="charPet" hidden aria-hidden="true"></span>
    <div class="char-top">
      <div class="level-badge">
        <div class="char-avatar" id="charAvatar" hidden aria-hidden="true"></div>
        <div class="level-ring" id="levelRing"><span id="levelNum">1</span></div>
        <div class="level-label">
          <div class="l1">Nivel</div>
          <div class="l2" id="levelSub">Aventurero novato</div>
          <div class="char-badges" id="charBadges" hidden></div>
        </div>
      </div>
      <div class="stat-pills">
        <div class="pill gold">🪙 <span class="num" id="coinsVal">0</span></div>
        <div class="pill streak">🔥 <span class="num" id="streakVal">0</span> días</div>
        <div class="pill boost" id="boostPill" hidden></div>
      </div>
    </div>
    <div>
      <div class="xp-track"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
      <div class="xp-caption"><span><span class="num" id="xpIntoVal">0</span> / <span class="num" id="xpNeedVal">0</span> XP</span><span id="xpTotalVal">0 XP totales</span></div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="resumen">Resumen</button>
    <button class="tab-btn" data-tab="misiones">Misiones</button>
    <button class="tab-btn" data-tab="habitos">Hábitos</button>
    <button class="tab-btn" data-tab="finanzas">Finanzas</button>
    <button class="tab-btn" data-tab="tienda">🛒 Tienda</button>
    <button class="tab-btn" data-tab="ajustes">Ajustes</button>
  </div>

  <div id="view-resumen"></div>
  <div id="view-misiones" hidden></div>
  <div id="view-habitos" hidden></div>
  <div id="view-finanzas" hidden></div>
  <div id="view-tienda" hidden></div>
  <div id="view-ajustes" hidden></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!--
  Scripts clásicos (sin módulos ES) para que la app funcione abriendo
  index.html directamente con file:// — sin servidor ni build.
  El orden importa: cada archivo registra su parte en window.LifeQuest.
-->
<!-- Núcleo: independiente de la UI -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/rules.js"></script>
<script src="js/state.js"></script>
<script src="js/storage/adapters.js"></script>
<script src="js/store.js"></script>
<script src="js/sync/sync.js"></script>
<script src="js/cloud/firebase-config.js"></script>
<script src="js/cloud/firestore-provider.js"></script>
<script src="js/game.js"></script>
<script src="js/finance/rules.js"></script>
<script src="js/finance/finance.js"></script>
<script src="js/shop/catalog.js"></script>
<script src="js/shop/shop.js"></script>
<script src="js/reminders.js"></script>
<!-- Integración nativa (Android vía Capacitor); no hace nada en el navegador -->
<script src="vendor/capacitor.js"></script>
<script src="js/platform/native.js"></script>
<script src="js/cloud/cloud.js"></script>
<!-- Interfaz -->
<script src="js/ui/common.js"></script>
<script src="js/ui/sound.js"></script>
<script src="js/ui/celebrate.js"></script>
<script src="js/ui/cosmetics.js"></script>
<script src="js/ui/character.js"></script>
<script src="js/ui/views/resumen.js"></script>
<script src="js/ui/views/misiones.js"></script>
<script src="js/ui/views/habitos.js"></script>
<script src="js/ui/views/finanzas.js"></script>
<script src="js/ui/views/tienda.js"></script>
<script src="js/ui/views/ajustes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
