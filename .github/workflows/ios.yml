name: App iPhone (compilación y prueba en simulador)

# Compila el proyecto nativo de iPhone (ios/) en una Mac de GitHub, lo abre en un
# simulador de iPhone y guarda una captura. No firma ni publica: para TestFlight /
# App Store hace falta la cuenta de desarrollador de Apple (ver docs/iphone.md).
on:
  push:
    branches: [main, 'claude/**']
    paths: ['ios/**', 'www/**', 'package.json', 'package-lock.json', 'capacitor.config.json', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'www/**', 'package.json', 'package-lock.json', 'capacitor.config.json', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar web → iPhone
        run: npx cap sync ios

      - name: Compilar para el simulador de iPhone
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 60

      - name: Abrir en un simulador de iPhone y tomar captura
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')))")
          echo "Simulador: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.cristianbuitrago.lifequest
          sleep 25
          xcrun simctl io "$DEVICE" screenshot iphone-simulador.png
          # Si la app se cerró sola (fallo al arrancar), la prueba falla.
          xcrun simctl spawn "$DEVICE" launchctl list | grep -q com.cristianbuitrago.lifequest
          echo "La app sigue abierta en el simulador ✅"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LifeCoinQuest-iPhone-simulador
          path: |
            iphone-simulador.png
            build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: ignore
