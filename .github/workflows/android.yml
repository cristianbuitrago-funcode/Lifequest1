name: APK Android

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

# Permiso para publicar el APK en Releases (página principal del repositorio)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Pruebas de sincronización (emuladores de Firebase)
        run: npm run test:cloud

      - name: Sincronizar web → Android
        run: npm run android:sync

      - name: Clave de firma compartida
        env:
          KEYSTORE_B64: ${{ secrets.LIFEQUEST_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lifequest-debug.keystore"
            echo "LIFEQUEST_DEBUG_KEYSTORE=$RUNNER_TEMP/lifequest-debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin el secreto LIFEQUEST_DEBUG_KEYSTORE_BASE64 el APK se firma con una clave temporal: no se instalará encima de versiones anteriores y el login de Google no funcionará."
          fi

      - name: Compilar APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LifeQuest-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ---------------------------------------------------------------------
      # Publica el APK en "Releases" cuando se actualiza main. Solo con la
      # clave compartida, para que siempre se pueda instalar encima de la
      # versión anterior sin perder datos.
      # ---------------------------------------------------------------------
      - name: Publicar APK en Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.LIFEQUEST_DEBUG_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          TAG="v$VERSION"
          APK="LifeQuest-$VERSION.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          # Copia con nombre fijo: el enlace .../releases/latest/download/LifeQuest.apk
          # siempre descarga la última versión.
          cp "$APK" LifeQuest.apk
          NOTES="Descarga **LifeQuest.apk** abajo, en *Assets*, y ábrelo en el teléfono para instalarlo (se instala encima de la versión anterior y conserva tus datos).

          Versión $VERSION · compilada desde el commit ${GITHUB_SHA::7}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" --latest
          else
            gh release create "$TAG" --title "LifeQuest $VERSION" --notes "$NOTES" --target "$GITHUB_SHA" --latest
          fi
          gh release upload "$TAG" "$APK" LifeQuest.apk --clobber

      - name: Aviso si no se publicó
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.LIFEQUEST_DEBUG_KEYSTORE == ''
        run: echo "::warning::El APK no se publicó en Releases porque falta el secreto LIFEQUEST_DEBUG_KEYSTORE_BASE64 (ver docs/firebase-setup.md, paso 7)."
